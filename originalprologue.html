<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epoch Atelier — The Prologue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0a0b;
    --plaster: #ede8df;
    --brass: #b08d4f;
    --brass-bright: #d9b876;
    --ink-dim: #6b6963;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--void);
    color: var(--plaster);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }
  .display { font-family: 'Instrument Serif', serif; }

  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* faint particles slowly drifting toward the center line, never quite arriving */
  .mote {
    position: absolute;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: var(--brass-bright);
    opacity: 0;
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translate(var(--x0), var(--y0)) scale(0.6); }
    20%  { opacity: 0.55; }
    50%  { opacity: 0.85; transform: translate(var(--x1), var(--y1)) scale(1); }
    80%  { opacity: 0.3; }
    100% { opacity: 0; transform: translate(var(--x0), var(--y0)) scale(0.6); }
  }

  /* the unfinished mark: a single line drawing itself, never closing the loop */
  #mark {
    width: min(46vw, 420px);
    height: min(46vw, 420px);
    position: relative;
    z-index: 2;
  }
  #mark path {
    fill: none;
    stroke: var(--brass);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 9s ease-in-out infinite;
    opacity: 0.85;
  }
  @keyframes draw {
    0%   { stroke-dashoffset: 900; opacity: 0; }
    12%  { opacity: 0.85; }
    55%  { stroke-dashoffset: 60; }
    75%  { stroke-dashoffset: 60; opacity: 0.85; }
    100% { stroke-dashoffset: -260; opacity: 0; }
  }

  #copy {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    pointer-events: none;
  }
  #copy .eyebrow {
    font-size: 0.66rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeIn 2s ease forwards 0.6s;
  }
  #copy h1 {
    font-size: clamp(2rem, 6vw, 3.6rem);
    font-weight: 400;
    font-style: italic;
    margin: 0 0 20px;
    letter-spacing: 0.01em;
    opacity: 0;
    animation: fadeIn 2s ease forwards 1.1s;
  }
  #copy p {
    max-width: 460px;
    color: var(--ink-dim);
    font-size: 0.88rem;
    line-height: 1.7;
    letter-spacing: 0.01em;
    margin: 0;
    opacity: 0;
    animation: fadeIn 2s ease forwards 1.7s;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  #footer {
    position: absolute;
    bottom: 26px;
    left: 0; right: 0;
    z-index: 3;
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    animation: fadeIn 2s ease forwards 2.4s;
  }
  #footer a {
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.3s, border-color 0.3s;
  }
  #footer a:hover { color: var(--brass-bright); border-color: var(--brass); }

  @media (prefers-reduced-motion: reduce) {
    .mote, #mark path { animation: none; opacity: 0.5; }
    #mark path { stroke-dashoffset: 60; }
  }
</style>
</head>
<body>

<div id="stage">

  <!-- drifting motes: energy not yet gathered into form -->
  <div class="mote" style="--x0:-140px; --y0:-90px; --x1:-20px; --y1:-8px; animation-delay:0s;"></div>
  <div class="mote" style="--x0:160px; --y0:-120px; --x1:24px; --y1:-14px; animation-delay:2.3s;"></div>
  <div class="mote" style="--x0:-180px; --y0:110px; --x1:-30px; --y1:16px; animation-delay:4.1s;"></div>
  <div class="mote" style="--x0:190px; --y0:130px; --x1:26px; --y1:20px; animation-delay:6.6s;"></div>
  <div class="mote" style="--x0:0px; --y0:-170px; --x1:0px; --y1:-30px; animation-delay:1.2s;"></div>
  <div class="mote" style="--x0:0px; --y0:170px; --x1:0px; --y1:28px; animation-delay:8.4s;"></div>
  <div class="mote" style="--x0:-210px; --y0:0px; --x1:-40px; --y1:0px; animation-delay:3.5s;"></div>
  <div class="mote" style="--x0:210px; --y0:0px; --x1:40px; --y1:0px; animation-delay:5.9s;"></div>

  <svg id="mark" viewBox="0 0 400 400">
    <path d="M 60 210 C 40 130, 110 55, 200 55 C 300 55, 350 130, 335 210 C 322 285, 250 340, 175 330 C 110 322, 65 280, 70 235" />
  </svg>

  <div id="copy">
    <span class="eyebrow">The Prologue</span>
    <h1 class="display">Epoch Atelier is<br>still coming into shape.</h1>
    <p>What you'd find here isn't finished — it's gathering. Craft, sound, and a few honest experiments, taking form one piece at a time.</p>
  </div>

  <div id="footer">
    <a href="#" title="Replace with your real Instagram link">Instagram</a>
    <a href="mailto:hello@epochatelier.art">Say hello</a>
  </div>

</div>

</body>
</html>
